name: Academic Projects CI

on:
  push:
    branches: [main]
    paths:
      - "projects/letter-recognition/**"
      - "projects/smoke-detection/**"
      - "projects/campusflow/**"
      - "projects/discretespell/**"
      - ".github/workflows/academic-projects-ci.yml"
  pull_request:
    paths:
      - "projects/letter-recognition/**"
      - "projects/smoke-detection/**"
      - "projects/campusflow/**"
      - "projects/discretespell/**"
      - ".github/workflows/academic-projects-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  letter-recognition:
    name: Letter Recognition — Python smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/letter-recognition
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/letter-recognition/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  smoke-detection:
    name: Smoke Detection — structural validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/smoke-detection
    steps:
      - uses: actions/checkout@v4
      - name: Show runner Python
        run: python3 --version
      - name: Install structural-test dependencies
        run: python3 -m pip install -r requirements-ci.txt
      - name: Compile public source
        run: python3 -m py_compile src/smoke_detection.py
      - name: Run synthetic heatmap test
        run: python3 -m unittest discover -s tests -v

  campusflow:
    name: CampusFlow — Java validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/campusflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"
      - run: javac -d out src/CampusFlowFinal.java
      - run: java -cp out CampusFlowFinal --selftest

  discretespell:
    name: DiscreteSpell — test, audit, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/discretespell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: projects/discretespell/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
