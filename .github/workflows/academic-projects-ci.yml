name: Academic Projects CI

on:
  push:
    branches: [main]
    paths:
      - "projects/campusflow/**"
      - "projects/discretespell/**"
      - ".github/workflows/academic-projects-ci.yml"
  pull_request:
    paths:
      - "projects/campusflow/**"
      - "projects/discretespell/**"
      - ".github/workflows/academic-projects-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  campusflow:
    name: CampusFlow — Java validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/campusflow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"

      - name: Compile
        run: javac -d out src/CampusFlowFinal.java

      - name: Self-test
        run: java -cp out CampusFlowFinal --selftest

  discretespell:
    name: DiscreteSpell — test, audit, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/discretespell
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: projects/discretespell/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Run 24 tests
        run: npm test

      - name: Production build
        run: npm run build
