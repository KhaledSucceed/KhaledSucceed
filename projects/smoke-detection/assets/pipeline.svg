<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Smoke Detection processing pipeline</title>
<desc id="desc">Architecture diagram showing YOLO localization followed by ROI grayscale, Otsu thresholding, mask refinement and heatmap overlay.</desc>
<rect width="1200" height="500" rx="28" fill="#f7fbff"/>
<text x="60" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233f">Smoke Detection — hybrid CV pipeline</text>
<text x="60" y="108" font-family="Arial,sans-serif" font-size="18" fill="#60748a">Architecture only · no fabricated detector output</text>
<g font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233f" text-anchor="middle">
<rect x="55" y="190" width="155" height="92" rx="18" fill="#ffffff" stroke="#cdddea"/><text x="132" y="228">Input</text><text x="132" y="253" font-size="14" font-weight="400" fill="#6a7d91">image</text>
<rect x="245" y="190" width="155" height="92" rx="18" fill="#e9f6f7" stroke="#7ec4cb"/><text x="322" y="228">YOLO</text><text x="322" y="253" font-size="14" font-weight="400" fill="#4d7980">localization</text>
<rect x="435" y="190" width="155" height="92" rx="18" fill="#ffffff" stroke="#cdddea"/><text x="512" y="228">ROI</text><text x="512" y="253" font-size="14" font-weight="400" fill="#6a7d91">grayscale</text>
<rect x="625" y="190" width="155" height="92" rx="18" fill="#f0edfa" stroke="#ada3d6"/><text x="702" y="228">Otsu</text><text x="702" y="253" font-size="14" font-weight="400" fill="#6f6593">threshold</text>
<rect x="815" y="190" width="155" height="92" rx="18" fill="#ffffff" stroke="#cdddea"/><text x="892" y="228">Mask</text><text x="892" y="253" font-size="14" font-weight="400" fill="#6a7d91">smoothing</text>
<rect x="1005" y="190" width="140" height="92" rx="18" fill="#e9f6f7" stroke="#7ec4cb"/><text x="1075" y="228">Heatmap</text><text x="1075" y="253" font-size="14" font-weight="400" fill="#4d7980">overlay</text>
</g>
<g stroke="#758aa0" stroke-width="3" fill="none">
<path d="M210 236 H245"/><path d="M400 236 H435"/><path d="M590 236 H625"/><path d="M780 236 H815"/><path d="M970 236 H1005"/>
</g>
<g fill="#758aa0"><path d="M238 230 l12 6 -12 6z"/><path d="M428 230 l12 6 -12 6z"/><path d="M618 230 l12 6 -12 6z"/><path d="M808 230 l12 6 -12 6z"/><path d="M998 230 l12 6 -12 6z"/></g>
<text x="60" y="382" font-family="Arial,sans-serif" font-size="16" fill="#64788e">Recovered parameters: confidence 0.25 · mask blur 25×25 · heatmap blur 101×101 · alpha 0.5</text>
<text x="60" y="420" font-family="Arial,sans-serif" font-size="16" fill="#8b5a04">Runtime reproduction remains blocked by the missing original model weights and test image.</text>
</svg>