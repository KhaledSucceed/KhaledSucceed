<text x="1120" y="96" text-anchor="end" font-family="Arial,sans-serif" font-size="16" fill="#60748a">15 Departments · 71 Courses · 16,000 Students</text>
<rect x="76" y="132" width="230" height="44" rx="12" fill="#e9f6f7"/><text x="191" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#176a73">Selection Sort Departments</text>
<rect x="320" y="132" width="210" height="44" rx="12" fill="#f0edfa"/><text x="425" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#5f5489">Merge Sort Courses</text>
<rect x="544" y="132" width="220" height="44" rx="12" fill="#eef4f9"/><text x="654" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#344e68">Insertion Sort Students</text>
<rect x="76" y="216" width="1024" height="310" rx="12" fill="#fbfdff" stroke="#d7e3ed"/><rect x="76" y="216" width="1024" height="48" rx="12" fill="#eff5fa"/>
<text x="110" y="247" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#2b4058">Department</text>
