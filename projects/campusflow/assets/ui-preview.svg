<rect x="76" y="548" width="1024" height="78" rx="12" fill="#f6f9fc"/><text x="100" y="574" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233f">Complexity guide</text>
<text x="100" y="600" font-family="Arial,sans-serif" font-size="13" fill="#65788d">Selection O(n²) · Insertion O(n²) worst case · Merge O(n log n) · Binary Search O(log n)</text>
